repos:
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        args: [-x]

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.0.1
    hooks:
      - id: cspell

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: validate-skill-catalog
        name: Validate skill catalog
        entry: bash -c 'source lib/common.sh && validate_skill_catalog'
        language: system
        pass_filenames: false
        files: ^(skills/|lib/common\.sh$)
